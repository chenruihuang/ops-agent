# ops-agent 全栈编排
# 启动：docker compose up -d --build
# 横向扩展验证：docker compose up -d --scale api=3
# 压测：docker compose --profile loadtest up -d locust
# 建库：docker compose run --rm build-kb
#
# 设计说明：
#   api 不 publish 端口 —— 由 nginx 统一入口，这样才能真正做到 --scale api=N
#   redis 用 redis-stack（自带 RediSearch），语义缓存靠它的 KNN 向量检索，不必额外起一个向量库
name: ops-agent

services:
  # ==================== 入口层 ====================
  nginx:
    image: nginx@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
    pull_policy: missing     # 本地有就直接用，没有才拉 —— 显式写出来，免得被误读成"每次都拉"
    container_name: ops-nginx
    ports:
      - "8080:80"          # 宿主 8080 —— 避免与 cs-agent 的 8000 冲突
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 业务服务（无状态，可横向扩展）====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # 注意：不写 container_name —— 会与 --scale 冲突
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=ops-agent-api
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # trace 落到可写挂载点（/app/data 是只读的，写进去会静默失败）
      - OBSERVABILITY_TRACE_DIR=/app/traces
    expose:
      - "8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./data:/app/data:ro
      - ./eval:/app/eval:ro
      # 只需要这一层可写：本地 JSONL 明细（会话回放的唯一事实源）
      - ./data/traces:/app/traces
      # 审计日志同理必须是可写挂载 —— 它在 ./data 下，而 ./data 整体是 :ro。
      # 第一次跑就踩到了：审计一条没落下来，而 /admin/sandbox/audit 只是返回空列表，
      # 看起来像"没人执行过写操作"（Docker 会按路径长度取更具体的挂载，不会冲突）。
      - ./data/audit:/app/data/audit
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      java-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s      # BGE 模型首次加载较慢
    deploy:
      replicas: 2            # docker compose v2 会遵守；也可用 --scale api=3 覆盖
    restart: unless-stopped

  # ==================== 工具服务（Java MCP）====================
  # JSON-RPC 2.0 over HTTP，5 个工具与 Python 侧 TOOL_SPECS 一一对应。
  # 故障注入靠请求头 X-Chaos（见 java-mcp/ChaosFilter.java），默认不生效。
  java-mcp:
    build:
      context: ./java-mcp
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Shanghai
    expose:
      - "8080"
    ports:
      # 宿主 18081 → 容器 8080，仅供本机用 Postman / curl 直连调试。
      # 刻意不复用 8080：宿主 8080 已被 nginx 占用（统一入口），
      # 打错端口时 nginx 会把 /mcp 转给 FastAPI，返回 {"detail":"Not Found"}，
      # 看起来像 MCP 服务坏了 —— 用一个不相邻的端口把这两件事彻底分开。
      # 不用 18080 是因为它已被遗留的手工容器 mcp-test 占着（同镜像、非 compose 管理）。
      - "18081:8080"
    healthcheck:
      # JRE 镜像没有 curl，用 Java 自己发一个 HTTP 探活？
      # 不 —— 那是把健康检查写成一个小程序。wget 也没有。
      # 用 bash 的 /dev/tcp 探测（temurin 镜像基于 ubuntu，有 bash）：
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s      # JVM 冷启动 + Spring 上下文
    restart: unless-stopped

  # ==================== 缓存层 ====================
  # redis-stack 含 RediSearch，语义缓存直接用 KNN 向量检索，省一个组件
  redis:
    image: redis/redis-stack-server:latest
    container_name: ops-redis
    ports:
      - "6379:6379"
    environment:
      # allkeys-lru：内存满时按 LRU 淘汰，缓存场景正解
      - REDIS_ARGS=--appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ==================== 检索层 ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ops-qdrant
    ports:
      - "6333:6333"          # REST + Dashboard http://localhost:6333/dashboard
      - "6334:6334"          # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ==================== 外部系统模拟（Java MCP Server 的数据源）====================
  mysql:
    image: mysql:8.4
    container_name: ops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ops_ticket
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"          # 避开本机可能已有的 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # ==================== 可观测层 ====================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ops-prometheus
    ports:
      # 宿主 9091 而非 9090 —— cs-agent 的 prometheus 已长期占用 9090，
      # 两个项目同机共存时容器会以 "port is already allocated" 启动失败，
      # 而 compose 会因此**中止整个 up**，把 nginx / grafana 一并留在 created 状态。
      # 容器间访问不受影响：grafana 数据源走 http://prometheus:9090（容器内端口）。
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ops-grafana
    ports:
      - "3001:3000"          # 避开 cs-agent 的 3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ==================== 一次性任务 ====================
  build-kb:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["build"]
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      # 同 api：容器内用服务名，别让 .env 里的 localhost 漏进来
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    # build 阶段（切块/建点/BM25/图谱）不依赖模型，先跑完再进入 index 阶段
    command: ["python", "-m", "scripts.ingest", "--stage", "all", "--backend", "qdrant"]

  eval:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["eval"]
    env_file:
      - .env
    environment:
      # 同 api：容器内用服务名
      # （本服务不依赖 Redis —— 检索评估是纯离线计算，别让 .env 的 localhost 漏进来即可）
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      - ./eval_output:/app/eval_output
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    # 一次跑出四组对比：关键词单路 / 向量单路 / 向量+RRF / +重排
    # 四组同题同 k，才能支撑"重排把 @1 从 x 提到 y"这种说法
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for cfg in "bm25" "local" "local --fusion rrf" "local --fusion rrf --rerank"; do
          echo "===== backend: $$cfg ====="
          python -m scripts.eval_retrieval --backend $$cfg --sweep
        done

  # ==================== 压测（docker compose --profile loadtest up -d locust）====================
  locust:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["loadtest"]
    env_file:
      - .env
    ports:
      - "8089:8089"          # Locust Web UI
    volumes:
      - ./loadtest:/app/loadtest:ro
    command:
      - locust
      - -f
      - /app/loadtest/locustfile.py
      - --host
      - http://nginx

volumes:
  redis_data:
  qdrant_data:
  mysql_data:
  prometheus_data:
  grafana_data:
  huggingface_cache:

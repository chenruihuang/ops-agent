worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 为什么不用 upstream 块：nginx 对 upstream 里的主机名**只在启动时解析一次**，
    # 之后永远打向拿到的那个 IP。实测 50 分钟内 1561 条 /chat 全部落在同一个
    # api 副本上，另一副本 0 条 —— "--scale api=N" 在这一行注释面前是假的。
    # 改用 Docker 内嵌 DNS（127.0.0.11）+ 变量 proxy_pass：每 5s 重新解析，
    # 副本扩缩、重建换 IP 都能跟上，请求在返回的全部 A 记录间轮转。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 压测口径需要真实客户端 IP，否则全被记成 nginx 的 IP
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_addr '
                    'urt_t=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # SSE 必须关闭缓冲，否则 token 会被攒批，TTFT 指标直接失真
        location / {
            set $ops_api api;
            proxy_pass http://$ops_api:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # ---- SSE 关键三行 ----
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # 首 token 可能等待较久（检索+重排），读超时给足
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            proxy_ignore_headers X-Accel-Expires Expires Cache-Control;
        }

        location /metrics {
            set $ops_api api;
            proxy_pass http://$ops_api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream ops_api {
        # 横向扩展验证点：api 服务多副本，nginx 轮询分发
        # docker compose up -d --scale api=3 时，Docker 内嵌 DNS 会自动返回全部副本 IP
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 压测口径需要真实客户端 IP，否则全被记成 nginx 的 IP
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # SSE 必须关闭缓冲，否则 token 会被攒批，TTFT 指标直接失真
        location / {
            proxy_pass http://ops_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # ---- SSE 关键三行 ----
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # 首 token 可能等待较久（检索+重排），读超时给足
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            proxy_ignore_headers X-Accel-Expires Expires Cache-Control;
        }

        location /metrics {
            proxy_pass http://ops_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}

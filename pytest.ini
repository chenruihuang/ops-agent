[pytest]
testpaths = tests
; 本仓库的异步用例写成无参 `async def test_xxx()`，不带 marker。
; pytest-asyncio 默认是 strict 模式 —— 只跑显式打了 marker 的用例，
; 于是「装了插件」反而比「没装」更糟：报错从
;   async def functions are not natively supported
; 变成一堆收集期失败，看不出真正原因。
; auto 模式下所有 async 测试自动被接管，无需逐个加 marker。
asyncio_mode = auto
; pytest-asyncio >= 0.24 要求显式声明 fixture 的事件循环作用域，否则发 deprecation warning。
asyncio_default_fixture_loop_scope = function

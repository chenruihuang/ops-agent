# monitoring/prometheus.yml
# 注意：顶层不能写 services: —— 这里只认 global / scrape_configs / rule_files 等
global:
  scrape_interval: 5s           # 压测场景调密一些，否则 MTTR 的"检测延迟"会被采样间隔污染
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ---- 业务服务：无状态多副本，用 DNS 服务发现拿全部副本 ----
  - job_name: ops-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 10s
    # 本地单机调试可改用 static_configs
    # static_configs:
    #   - targets: ["api:8000"]

  # ---- Prometheus 自身 ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Java MCP Server（Spring Boot Actuator，D2 上午接入）----
  - job_name: java-mcp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["java-mcp:8080"]
